location ~ ^/(ui|api|_internal)(/|$) {
    return 404;
}

location ~ ^/(stats|metrics|health|openapi\.json)/?$ {
    return 404;
}

location = / {
    root "@PROXY_PAGE_DIR@";
    try_files /index.html =404;
}

location ^~ /site-assets/ {
    root "@PROXY_PAGE_DIR@";
    try_files $uri =404;
    expires 1h;
}
